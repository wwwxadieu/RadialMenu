[package]
name = "radial-menu"
version = "0.1.0"
description = "Menu tròn thay menu chuột phải của Windows"
authors = ["MrBeoHP"]
license = "GPL-3.0-only"
repository = "https://github.com/wwwxadieu/RadialMenu"
edition = "2021"
rust-version = "1.90"

[lib]
name = "radial_menu_lib"
crate-type = ["rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-single-instance = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = [
  "Win32_Foundation",
  "Win32_Graphics_Gdi",
  "Win32_System_LibraryLoader",
  "Win32_System_Threading",
  "Win32_UI_HiDpi",
  "Win32_UI_Input_KeyboardAndMouse",
  "Win32_UI_WindowsAndMessaging",
  "Win32_Security",
  "Win32_System_Com",
  "Win32_UI_Shell",
  "Win32_System_Registry",
  "Win32_System_SystemInformation",
  "Win32_System_DataExchange",
] }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true

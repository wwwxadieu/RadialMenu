# Phát hành: GitHub tự build bộ cài và tạo release, theo một trong hai cách:
#   - đẩy tag: git tag v1.2.3 && git push origin v1.2.3
#   - hoặc vào tab Actions › Phát hành › Run workflow, nhập v1.2.3:
#     workflow build từ nhánh đang chọn rồi tự tạo tag khi đăng release.
#
# Trước đó:
#   1. Nâng phiên bản ở package.json, src-tauri/tauri.conf.json, src-tauri/Cargo.toml.
#   2. Viết ghi chú phát hành ở docs/releases/v1.2.3.md.
#
# Cần secret TAURI_SIGNING_PRIVATE_KEY (khoá ký bản cập nhật):
# app chỉ cài bản cập nhật có chữ ký khớp khoá công khai trong tauri.conf.json.
name: Phát hành

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag phát hành, ví dụ v0.3.0 (phải khớp phiên bản trong tauri.conf.json)"
        required: true
        type: string

permissions:
  contents: write

env:
  TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}

concurrency:
  group: release-${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Kiểm tra tag khớp phiên bản
        shell: bash
        run: |
          v=$(node -p "require('./src-tauri/tauri.conf.json').version")
          if [ "$TAG" != "v$v" ]; then
            echo "::error::Tag $TAG không khớp phiên bản $v trong tauri.conf.json"
            exit 1
          fi

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Cài gói npm
        run: npm ci

      - name: Kiểm tra kiểu và build giao diện
        run: npm run build

      - name: Test Rust
        run: cargo test --manifest-path src-tauri/Cargo.toml

      - name: Build bộ cài có chữ ký cập nhật
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          # Mật khẩu của file khoá, không phải bí mật: bí mật là chính khoá trong secret.
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: radialmenu-updater
        run: npm run tauri build -- --config "${{ github.workspace }}\src-tauri\tauri.release.conf.json"

      - name: Chuẩn bị file phát hành
        run: node scripts/release.cjs "$env:TAG"

      - name: Tạo release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          v="${TAG#v}"
          files=("release/RadialMenu_${v}_x64-setup.exe" release/latest.json)
          if gh release view "$TAG" >/dev/null 2>&1; then
            # Release đã tạo tay trên web (kèm tag): chỉ gắn file và thay ghi chú.
            gh release upload "$TAG" "${files[@]}" --clobber
            gh release edit "$TAG" --title "Radial Menu ${v}" --notes-file release/body.md
          elif [ "$GITHUB_EVENT_NAME" = "push" ]; then
            gh release create "$TAG" "${files[@]}" --title "Radial Menu ${v}" --notes-file release/body.md --verify-tag
          else
            # Chạy tay: tag được tạo ngay tại commit vừa build.
            gh release create "$TAG" "${files[@]}" --title "Radial Menu ${v}" --notes-file release/body.md --target "$GITHUB_SHA"
          fi
